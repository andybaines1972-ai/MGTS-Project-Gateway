<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MGTS Project Gateway</title>
<meta name="description" content="Idea generator, go/no-go gateway and AI/IoT guide for the BTEC HNC Unit 4004 Pearson-set project.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Titillium+Web:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: MGTS charcoal + gold. Sticky top bar, numbered step tabs (a real sequence), one working panel per step. */
:root{
  --bg:#F2F3F5; --surface:#FFFFFF; --sunk:#E8EAEE; --line:#D3D6DD; --fg:#1A1C21; --muted:#5B606B;
  --gold:#8F6608; --gold-soft:#F4E7C4; --on-gold:#FFFFFF;
  --go:#1E7A46; --go-soft:#DDF1E4; --warn:#9A5B00; --warn-soft:#FBEBCF; --stop:#B3261E; --stop-soft:#F9DEDB;
  --f-display:"Sora",system-ui,sans-serif; --f-body:"Titillium Web",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16171A; --surface:#1F2125; --sunk:#26292E; --line:#353941; --fg:#ECEAE4; --muted:#A2A6AE;
  --gold:#E0B23F; --gold-soft:#3A3019; --on-gold:#16171A;
  --go:#5CC98A; --go-soft:#173324; --warn:#F0B35A; --warn-soft:#3A2B14; --stop:#F2897F; --stop-soft:#3C1E1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16171A; --surface:#1F2125; --sunk:#26292E; --line:#353941; --fg:#ECEAE4; --muted:#A2A6AE;
  --gold:#E0B23F; --gold-soft:#3A3019; --on-gold:#16171A;
  --go:#5CC98A; --go-soft:#173324; --warn:#F0B35A; --warn-soft:#3A2B14; --stop:#F2897F; --stop-soft:#3C1E1B; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
h2{font-size:1.55rem}h3{font-size:1.08rem}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.82rem}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:1.15rem}
.badge{font-family:var(--f-mono);font-size:.74rem;padding:3px 8px;border-radius:999px;background:var(--gold-soft);color:var(--gold);white-space:nowrap}
nav.steps{display:flex;gap:4px;overflow-x:auto;margin-left:auto;scrollbar-width:thin;max-width:100%}
nav.steps a{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.92rem;white-space:nowrap}
nav.steps a .n{font-family:var(--f-mono);font-size:.72rem;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
nav.steps a:hover{background:var(--sunk);color:var(--fg)}
nav.steps a[aria-current="page"]{background:var(--gold);color:var(--on-gold)}
nav.steps a[aria-current="page"] .n{border-color:currentColor}

main{padding-block:28px 64px}
section.view{display:grid;gap:22px}
.intro{display:grid;gap:8px;max-width:72ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn.small{padding:5px 10px;font-size:.88rem}
.btn.danger{color:var(--stop)}
label.f{display:grid;gap:4px;font-weight:600;font-size:.9rem;min-width:0}
input[type=text],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-weight:400}
textarea{min-height:76px;resize:vertical}
.chip{display:inline-block;font-family:var(--f-mono);font-size:.72rem;padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold)}

/* theme view */
.hero{display:grid;gap:14px;padding:26px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.hero .theme{font-family:var(--f-display);font-size:clamp(2rem,6vw,3.4rem);font-weight:700;color:var(--gold);line-height:1.05}
.rule{border-left:3px solid var(--gold);padding:10px 14px;background:var(--gold-soft);border-radius:0 6px 6px 0;font-weight:600}
.deadlines{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.deadline{padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.deadline b{display:block;font-family:var(--f-display);font-size:1.05rem}
.deadline .left{font-family:var(--f-mono);font-size:.78rem;color:var(--gold)}
ol.plain,ul.plain{margin:0;padding-left:1.2em;display:grid;gap:6px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.opt .l{font-family:var(--f-mono);font-weight:500;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--sunk)}
.avoid li::marker{color:var(--stop)}

/* ideas */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.idea.isChosen{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.idea .chips{display:flex;gap:6px;flex-wrap:wrap}
.idea dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:.92rem}
.idea dt{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:3px}
.idea dd{margin:0;min-width:0}
.aijob{background:var(--sunk);border-radius:6px;padding:8px 10px;font-size:.93rem}
.aijob b{color:var(--gold)}
details summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--muted)}
details[open] summary{margin-bottom:8px}
.shortlist{display:grid;gap:8px}
.sl{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.sl .t{min-width:0;font-weight:600}
.sl select{width:auto;padding:4px 6px;font-size:.85rem}
.counter{font-family:var(--f-mono);font-size:.8rem}
.ok{color:var(--go)} .bad{color:var(--warn)}
@media (max-width:560px){.sl{grid-template-columns:1fr 1fr}.sl .t{grid-column:1/-1}}

/* gateway */
.q{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .why{font-size:.88rem;color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:.68rem;padding:1px 6px;border-radius:4px;margin-right:6px;vertical-align:2px}
.tag.must{background:var(--stop-soft);color:var(--stop)} .tag.should{background:var(--sunk);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"][data-v="yes"]{background:var(--go-soft);color:var(--go)}
.seg button[aria-pressed="true"][data-v="unsure"]{background:var(--warn-soft);color:var(--warn)}
.seg button[aria-pressed="true"][data-v="no"]{background:var(--stop-soft);color:var(--stop)}
.seg button[aria-pressed="true"][data-v="na"]{background:var(--sunk);color:var(--fg)}
@media (max-width:620px){.q{grid-template-columns:1fr}}
.verdict{border-radius:var(--r);padding:18px 20px;display:grid;gap:10px;border:1px solid var(--line)}
.verdict .big{font-family:var(--f-display);font-size:1.6rem;font-weight:700}
.verdict.go{background:var(--go-soft);border-color:var(--go)} .verdict.go .big{color:var(--go)}
.verdict.cond{background:var(--warn-soft);border-color:var(--warn)} .verdict.cond .big{color:var(--warn)}
.verdict.nogo{background:var(--stop-soft);border-color:var(--stop)} .verdict.nogo .big{color:var(--stop)}
.verdict.pending{background:var(--sunk)}
.gaugebar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.gaugebar i{display:block;height:100%;background:var(--gold);transition:width .2s}

/* stack */
.stackwrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
@media (max-width:820px){.stackwrap{grid-template-columns:1fr}}
.layers{display:grid;gap:0}
.layer{display:grid;grid-template-columns:44px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;width:100%}
.layer:hover{border-color:var(--gold)}
.layer[aria-expanded="true"]{border-color:var(--gold)}
.layer .lv{font-family:var(--f-mono);font-size:.78rem;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);color:var(--gold);font-weight:500}
.layer.ai .lv{background:var(--gold);color:var(--on-gold)}
.layer .sum{font-size:.92rem;color:var(--muted)}
.layer .mine{font-size:.86rem;margin-top:4px;color:var(--fg)}
.layer .mine b{font-family:var(--f-mono);font-size:.7rem;color:var(--gold);letter-spacing:.05em}
.arrow{height:22px;display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono);font-size:.75rem}
.layerbody{grid-column:1/-1;display:grid;gap:12px;padding-top:6px;cursor:auto}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:8px}
.term{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:.88rem}
.term b{display:block;font-family:var(--f-mono);font-size:.78rem;color:var(--gold)}
.hitl{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);border:2px dashed var(--gold);border-radius:var(--r);padding:16px;background:var(--surface);display:grid;gap:10px}
.hitl h3{color:var(--gold)}

/* criteria */
.lo{display:grid;gap:12px}
.crit{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.crit .code{font-family:var(--f-display);font-weight:700;font-size:1.1rem;width:48px;height:48px;border-radius:8px;display:grid;place-items:center;background:var(--sunk)}
.crit.m .code{background:var(--gold-soft);color:var(--gold)}
.crit.d .code{background:var(--gold);color:var(--on-gold)}
.crit .ai{font-size:.9rem;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.crit .ai b{font-family:var(--f-mono);font-size:.72rem;color:var(--gold)}
.tip{font-size:.9rem;padding:10px 12px;border-radius:6px;background:var(--gold-soft)}

/* summary */
pre.out{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:14px;font-family:var(--f-mono);font-size:.82rem;margin:0;max-height:560px;overflow:auto}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border-radius:6px;background:var(--stop-soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-weight:600;z-index:20}
footer{border-top:1px solid var(--line);padding-block:18px;font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>MGTS Project Gateway</h1><span class="badge" id="themeBadge"></span></div>
    <nav class="steps" id="nav" aria-label="Steps"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
